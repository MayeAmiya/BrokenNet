<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, "Segoe UI", sans-serif;
    background: #1f1f1f;
    color: #c8c8c8;
    font-size: 16px;
  }
  /* 根：列布局，room 模式只有 #box，map 模式 #box + #mapLabel */
  #root { display: flex; flex-direction: column; width: 100%; height: 100%; }
  #box { display: flex; flex: 1 1 0; min-height: 0; border: 1px solid #3a3a3a; }
  #imgArea {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  #img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  #noPreview { color: rgba(255,255,255,0.4); font-size: 16px; }
  #info {
    width: 200px;
    flex-shrink: 0;
    border-left: 1px solid #3a3a3a;
    background: #1f1f1f;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #mapName { font-size: 15px; color: #c8c8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #roomLine { font-size: 14px; color: #8a8a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  #members { flex: 1 1 0; min-height: 0; overflow-y: auto; margin-top: 4px; font-size: 14px; line-height: 19px; color: #8a8a8a; }
  #members::-webkit-scrollbar { width: 4px; }
  #members::-webkit-scrollbar-thumb { background: #3a3a3a; }
  .member { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* map 模式底部图名条 */
  #mapLabel {
    display: none;
    flex-shrink: 0;
    height: 20px;
    line-height: 20px;
    padding: 0 8px;
    font-size: 13px;
    color: #c8c8c8;
    background: #1f1f1f;
    border: 1px solid #3a3a3a;
    border-top: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div id="root">
    <div id="box">
      <div id="imgArea">
        <img id="img" draggable="false" />
        <span id="noPreview" style="display:none">无地图预览</span>
      </div>
      <div id="info">
        <div id="mapName"></div>
        <div id="roomLine"></div>
        <div id="members"></div>
      </div>
    </div>
    <div id="mapLabel"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron')
    ipcRenderer.on('map-preview:content', (_e, data) => {
      const isMap = data.mode === 'map'
      const img = document.getElementById('img')
      const noPreview = document.getElementById('noPreview')
      if (data.imageUrl) {
        img.src = data.imageUrl
        img.style.display = ''
        noPreview.style.display = 'none'
      } else {
        img.style.display = 'none'
        noPreview.style.display = ''
      }
      const info = document.getElementById('info')
      info.style.display = isMap ? 'none' : ''
      const mapLabel = document.getElementById('mapLabel')
      mapLabel.style.display = isMap ? '' : 'none'
      mapLabel.textContent = data.mapName || ''
      if (isMap) return
      document.getElementById('mapName').textContent = data.mapName || ''
      document.getElementById('roomLine').textContent =
        data.roomName ? `${data.roomName} · ${data.playerCount ?? 0}/${data.maxPlayers ?? 0}` : ''
      const membersEl = document.getElementById('members')
      membersEl.textContent = ''
      const members = data.members || []
      if (!members.length) {
        membersEl.textContent = '（空房）'
      } else {
        for (const m of members) {
          const row = document.createElement('div')
          row.className = 'member'
          row.textContent = (m.isHost ? '👑 ' : '• ') + (m.name || '')
          membersEl.appendChild(row)
        }
      }
    })
  </script>
</body>
</html>
